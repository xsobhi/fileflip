[package]
name = "fileflip-shell"
description = "Explorer context-menu extension (IContextMenu) for FileFlip"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fileflip_shell"
crate-type = ["cdylib"]

[dependencies]
fileflip-core = { path = "../core" }
windows-core = { workspace = true }
windows = { workspace = true, features = [
  "implement",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
